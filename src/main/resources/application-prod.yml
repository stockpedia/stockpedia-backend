spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false


logging:
  file:
    name: /home/ubuntu/KTB/logs/backend.log


server:
  forward-headers-strategy: framework


aws:
  region: ap-northeast-2
  s3:
    bucket: ${S3_BUCKET}