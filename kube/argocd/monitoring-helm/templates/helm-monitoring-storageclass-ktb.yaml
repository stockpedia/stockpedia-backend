apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: monitoring-storageclass-local-ktb
provisioner: {{ .Values.storage.provisioner }}
volumeBindingMode: {{ .Values.storage.volumeBindingMode }}
reclaimPolicy: {{ .Values.storage.reclaimPolicy }}
---
{{- range $name, $volume := dict "prometheus" .Values.storage.prometheus "loki" .Values.storage.loki "grafana" .Values.storage.grafana }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}-persistentvolume
  labels:
    app.kubernetes.io/component: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  capacity:
    storage: {{ $volume.size }}
  volumeMode: {{ $.Values.storage.volumeMode }}
  accessModes:
    - {{ $.Values.storage.accessMode }}
  persistentVolumeReclaimPolicy: {{ $.Values.storage.reclaimPolicy }}
  storageClassName: monitoring-storageclass-local-ktb
  local:
    path: {{ $volume.hostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ $volume.nodeName }}
---
{{- end }}