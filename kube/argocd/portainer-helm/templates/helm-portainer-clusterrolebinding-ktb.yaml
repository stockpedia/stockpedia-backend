apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-clusterrolebinding-ktb
  labels:
    app.kubernetes.io/name: portainer
    app.kubernetes.io/part-of: ktb
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portainer-clusterrole-ktb
subjects:
  - kind: ServiceAccount
    name: serviceaccount-portainer-ktb
    namespace: {{ .Release.Namespace }}