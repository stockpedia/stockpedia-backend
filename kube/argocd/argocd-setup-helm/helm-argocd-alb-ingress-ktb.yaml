apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-argocd-ktb
  namespace: argocd
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:925663248026:certificate/fd776ed0-19ed-4377-9981-96a24db26733"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/subnets: subnet-06412b28d73f82e7c, subnet-01a255286aa892328
    alb.ingress.kubernetes.io/group.name: k8s-public-ktb
    # alb.ingress.kubernetes.io/inbound-cidrs: 193.186.4.132/32, 211.244.225.224/32
spec:
  ingressClassName: alb
  rules:
    - host: argocd.shiftknu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
