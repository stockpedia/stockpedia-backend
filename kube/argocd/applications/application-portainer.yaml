apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portainer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/stockpedia/stockpedia-backend.git
    targetRevision: main
    path: kube/argocd/portainer-helm
  destination:
    server: https://kubernetes.default.svc
    namespace: portainer
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    automated:
      prune: false
      selfHeal: false