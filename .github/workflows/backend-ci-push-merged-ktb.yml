on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: backend-ci-push-merged-ktb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 통합 테스트 및 빌드 검증
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle 실행 권한
        run: chmod +x ./gradlew

      - name: 테스트 DB 컨테이너 실행
        run: docker compose -f github-actions-docker-db.yml up -d --wait --wait-timeout 60

      - name: 통합 테스트 실행
        run: ./gradlew integrationTest --no-daemon

      - name: 테스트 컨테이너 정리
        if: always()
        run: docker compose -f github-actions-docker-db.yml down --volumes --remove-orphans

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 검증
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max