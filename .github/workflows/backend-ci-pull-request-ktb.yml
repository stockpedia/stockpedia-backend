on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: backend-ci-pull-request-ktb-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle 실행 권한
        run: chmod +x ./gradlew

      - name: 단위 테스트 실행
        run: ./gradlew test --no-daemon