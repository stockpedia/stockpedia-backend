name: 쿠버네티스 ArgoCD 배포

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build-push:
    environment: backend-production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: ECR 로그인
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 ECR 푸시
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login.outputs.registry }}/stockpedia-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-image-tag:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: values.yaml 태그 교체
        run: |
          sed -i "s|^    tag:.*|    tag: ${{ github.sha }}|" kube/argocd/umbrella-helm/values.yaml

      - name: 깃허브 커밋 & 푸쉬
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add kube/argocd/umbrella-helm/values.yaml
          git commit -m "chore: bump image ${{ github.sha }} [ci skip]" || echo "변경 없음"
          git push