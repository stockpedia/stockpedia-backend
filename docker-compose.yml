services:
  nginx:
    container_name: nginx-backend-ktb
    image: 925663248026.dkr.ecr.ap-northeast-2.amazonaws.com/nginx-ecr-ktb:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    networks:
      - app_net

  ktb:
    container_name: app-backend-ktb
    image: 925663248026.dkr.ecr.ap-northeast-2.amazonaws.com/stockpedia-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    networks:
      - app_net

  portainer:
    container_name: portainer-agent-backend-ktb
    image: 925663248026.dkr.ecr.ap-northeast-2.amazonaws.com/potainer-ecr-ktb:2.39.4
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    networks:
      - management_net

networks:
  app_net:
  management_net: